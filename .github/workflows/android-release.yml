# Signed release APK (sideload / QA) + Play Store App Bundle (.aab).
# Secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS
#
# Artifacts: every run → download app-release.apk and app-release.aab from the workflow run.
# GitHub Release: push a tag v* (e.g. v1.0.6) to also attach both files to a release.
name: Android release (APK + AAB)

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: |
          flutter --version
          flutter pub get

      - name: Configure Android release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64. Repo → Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ -z "${STORE_PASSWORD:-}" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_PASSWORD (keystore / store password)."
            exit 1
          fi
          if [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::Missing ANDROID_KEY_PASSWORD (key password)."
            exit 1
          fi
          if [ -z "${KEY_ALIAS:-}" ]; then
            echo "::error::Missing ANDROID_KEY_ALIAS (must match alias in .jks, e.g. key0)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/ci-release.jks
          printf '%s\n' \
            "storePassword=${STORE_PASSWORD}" \
            "keyPassword=${KEY_PASSWORD}" \
            "keyAlias=${KEY_ALIAS}" \
            "storeFile=ci-release.jks" \
            > android/key.properties

      - name: Build release APK
        run: flutter build apk --release

      - name: Build Play Store bundle (App Bundle)
        run: flutter build appbundle --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 90

  publish-release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: release-assets

      - name: Download App Bundle
        uses: actions/download-artifact@v4
        with:
          name: app-release-aab
          path: release-assets

      - name: Publish GitHub Release with APK + AAB
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            release-assets/app-release.apk
            release-assets/app-release.aab
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
