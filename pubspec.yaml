name: foodnpalsapp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.6+31

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.4.2
  shared_preferences: ^2.2.2
  http: ^1.2.1
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  url_launcher: ^6.2.6
  cupertino_icons: ^1.0.8
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.1
  google_sign_in: ^6.2.1
  webview_flutter_android: ^3.12.1
  webview_flutter_wkwebview: ^3.9.4
  flutter_background_service: ^5.1.0
  flutter_local_notifications: ^20.1.0
  dio: ^5.9.2
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  change_app_package_name: ^1.1.0

flutter:
  uses-material-design: true
  assets:
    - android_asset/offline.html
    - assets/images/
    - assets/videos/locationpermission.mp4
    - assets/videos/why_permission.mp4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "appicon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "appicon.png"
  remove_alpha_ios: true